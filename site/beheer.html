<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Beheer inschrijvingen | VVZ'49</title>
  <link rel="icon" href="https://thewally.github.io/vvz-toolbox/logo-vvz.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <style>
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi div { border: 2px solid var(--groen); border-radius: 8px; padding: 10px 12px; }
    .kpi span { display: block; font-size: .8rem; color: var(--grijs); }
    .kpi strong { font-size: 1.3rem; color: var(--groen-donker); }
    .balk { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
    .balk input, .balk select { width: auto; flex: 1; min-width: 160px; }
    .inschr { border: 1px solid var(--rand); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
    .inschr.betaald { border-left: 6px solid var(--groen); }
    .inschr.open { border-left: 6px solid #f9a825; }
    .inschr-kop { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
    .inschr-kop .meta { font-size: .85rem; color: var(--grijs); }
    .betaald-vink { display: flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
    .betaald-vink input { width: 20px; height: 20px; accent-color: var(--groen); }
    table.lijst { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .9rem; }
    table.lijst th, table.lijst td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--rand); }
    table.lijst th { color: var(--grijs); font-weight: 600; }
    table.wijz { margin-top: 12px; font-size: .85rem; }
    table.wijz caption { text-align: left; font-weight: 600; color: var(--groen-donker); padding-top: 6px; }
    .taak { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .taak input { width: 18px; height: 18px; accent-color: var(--groen); }
    .taak.open-taak { color: #b26a00; }
    .vervallen { color: var(--grijs); text-decoration: line-through; }
    .teams { font-size: .9rem; columns: 3 180px; margin-bottom: 20px; }
    .knoppen { display: flex; gap: 6px; flex-wrap: wrap; }
    .klein { padding: 4px 10px; font-size: .85rem; font-weight: 600; }
    .knop-gevaar { background: #fff; color: var(--fout); border-color: var(--fout); }
    td.acties-cel { text-align: right; white-space: nowrap; }
    dialog { border: none; border-radius: 10px; padding: 20px; width: min(520px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    dialog h2 { margin-top: 0; }
  </style>
</head>
<body>
<div class="wrap breed">
  <header class="kop">
    <img src="https://thewally.github.io/vvz-toolbox/logo-vvz.png" alt="VVZ'49">
    <h1>Beheer inschrijvingen</h1>
    <p id="sub"></p>
  </header>

  <form id="login" class="wrap" style="padding:0;max-width:360px">
    <div class="veld"><label for="ww">Wachtwoord</label><input id="ww" type="password" autocomplete="current-password" required></div>
    <div id="login-melding"></div>
    <button class="knop-primair" style="width:100%">Inloggen</button>
  </form>

  <main id="beheer" class="verborgen">
    <div class="kpi" id="kpi"></div>
    <details><summary><strong>Aantal per team</strong></summary><div class="teams" id="teams"></div></details>
    <div class="balk" style="margin-top:16px">
      <input id="zoek" placeholder="Zoek op naam, e-mail of referentie">
      <select id="filter-betaald"><option value="">Alle inschrijvingen</option><option value="open">Met open acties</option><option value="klaar">Alles afgehandeld</option></select>
      <select id="filter-team"><option value="">Alle teams</option></select>
      <button class="knop-secundair" id="ververs">Verversen</button>
      <button class="knop-secundair" id="export">CSV-export</button>
    </div>
    <div id="lijst"></div>
    <section id="verw-sectie" class="verborgen">
      <h2 style="margin-top:28px">Verwijderde inschrijvingen</h2>
      <div id="verwijderd"></div>
    </section>
  </main>

  <dialog id="dlg">
    <form id="dlg-form" method="dialog" novalidate>
      <h2 id="dlg-titel"></h2>
      <div id="dlg-velden"></div>
      <div id="dlg-melding"></div>
      <div class="acties">
        <button type="button" class="knop-secundair" id="dlg-annuleer">Annuleren</button>
        <button type="submit" class="knop-primair">Opslaan</button>
      </div>
    </form>
  </dialog>
</div>

<script>
(() => {
  const C = window.VVZ_CONFIG;
  const $ = (s, el = document) => el.querySelector(s);
  const euro = (n) => '€ ' + Number(n).toFixed(2).replace('.', ',');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const datum = (d) => d ? new Date(d).toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const gebdatum = (d) => d ? d.split('-').reverse().join('-') : '';
  const naam = (i) => [i.voornaam, i.tussenvoegsel, i.achternaam].filter(Boolean).join(' ');
  let ww = sessionStorageGet();
  let data = [];
  let verwijderd = [];

  $('#sub').textContent = `${C.WEDSTRIJD} · ${C.DATUM_TEKST}`;

  function sessionStorageGet() { try { return sessionStorage.getItem('vvz_ww') || ''; } catch { return ''; } }
  function sessionStorageSet(v) { try { v ? sessionStorage.setItem('vvz_ww', v) : sessionStorage.removeItem('vvz_ww'); } catch {} }

  const rpc = (naam, body) => window.vvzRpc(naam, body);

  async function laad() {
    const res = await rpc('beheer_overzicht', { wachtwoord: ww });
    if (!res.ok) { sessionStorageSet(''); throw new Error(res.fout); }
    sessionStorageSet(ww);
    data = res.inschrijvingen;
    verwijderd = res.verwijderd || [];
    $('#login').classList.add('verborgen');
    $('#beheer').classList.remove('verborgen');
    teken();
  }

  $('#login').addEventListener('submit', async (e) => {
    e.preventDefault();
    ww = $('#ww').value;
    try { await laad(); } catch (err) { $('#login-melding').innerHTML = `<div class="melding fout">${esc(err.message)}</div>`; }
  });

  function teken() {
    const alle = data.flatMap(i => i.deelnemers);
    const jong = alle.filter(d => d.categorie === 't/m 15').length;
    const verwacht = data.reduce((s, i) => s + Number(i.totaal_bedrag), 0);
    const alleWijz = [...data.flatMap(i => i.wijzigingen || []), ...verwijderd];
    const openTaak = (w, t) => w.taak === t && !w.afgehandeld && !w.vervallen;
    const teOntvangen = data.reduce((s, i) => s + (i.betaald ? 0 : Number(i.inschrijf_bedrag)), 0)
      + alleWijz.filter(w => openTaak(w, 'betalen')).reduce((s, w) => s + Number(w.bedrag), 0);
    const teRug = alleWijz.filter(w => openTaak(w, 'terugstorten')).reduce((s, w) => s + Number(w.bedrag), 0);
    $('#kpi').innerHTML = `
      <div><span>Inschrijvingen</span><strong>${data.length}</strong></div>
      <div><span>Personen</span><strong>${alle.length}</strong></div>
      <div><span>t/m 15 / vanaf 16</span><strong>${jong} / ${alle.length - jong}</strong></div>
      <div><span>Totaal verwacht</span><strong>${euro(verwacht)}</strong></div>
      <div><span>Nog te ontvangen</span><strong>${euro(teOntvangen)}</strong></div>
      <div><span>Nog terug te storten</span><strong>${euro(teRug)}</strong></div>`;

    const perTeam = {};
    alle.forEach(d => perTeam[d.team] = (perTeam[d.team] || 0) + 1);
    const teams = Object.keys(perTeam).sort();
    $('#teams').innerHTML = teams.map(t => `<div>${esc(t)}: <strong>${perTeam[t]}</strong></div>`).join('') || '<p>Nog geen inschrijvingen.</p>';
    const sel = $('#filter-team'), huidig = sel.value;
    sel.innerHTML = '<option value="">Alle teams</option>' + teams.map(t => `<option>${esc(t)}</option>`).join('');
    sel.value = huidig;

    const zoek = $('#zoek').value.trim().toLowerCase();
    const fb = $('#filter-betaald').value, ft = $('#filter-team').value;
    const zicht = data.filter(i =>
      (!fb || (fb === 'open') === heeftOpen(i)) &&
      (!ft || i.deelnemers.some(d => d.team === ft)) &&
      (!zoek || [naam(i), i.email, i.referentie, ...i.deelnemers.map(d => d.voornaam + ' ' + d.achternaam)]
        .join(' ').toLowerCase().includes(zoek)));

    $('#lijst').innerHTML = zicht.map(i => `
      <div class="inschr ${heeftOpen(i) ? 'open' : 'betaald'}">
        <div class="inschr-kop">
          <div>
            <strong>${esc(naam(i))}</strong> · ${esc(i.referentie)} · <strong>${euro(i.totaal_bedrag)}</strong>
            <div class="meta">${esc(i.email)} · ${esc(i.telefoon)} · ingeschreven ${datum(i.aangemaakt_op)}
              · bevestiging ${i.bevestiging_verstuurd_op ? 'verstuurd' : 'nog niet verstuurd'}</div>
          </div>
          <div class="knoppen">
            <label class="betaald-vink"><input type="checkbox" data-id="${i.id}" ${i.betaald ? 'checked' : ''}> Inschrijving betaald (${euro(i.inschrijf_bedrag)})</label>
            <button class="knop-secundair klein" data-actie="wijzig-contact" data-insc="${i.id}">Contactpersoon wijzigen</button>
            <button class="knop-secundair klein" data-actie="nieuwe-persoon" data-insc="${i.id}">+ Persoon</button>
            <button class="knop-gevaar klein" data-actie="verwijder-insc" data-insc="${i.id}">Verwijderen</button>
          </div>
        </div>
        <table class="lijst">
          <tr><th>Naam</th><th>Geboortedatum</th><th>Team</th><th>Tarief</th><th></th></tr>
          ${i.deelnemers.map(d => `<tr><td>${esc(d.voornaam)} ${esc(d.achternaam)}</td><td>${gebdatum(d.geboortedatum)}</td>
            <td>${esc(d.team)}</td><td>${esc(d.categorie)} (${euro(d.prijs)})</td>
            <td class="acties-cel"><button class="knop-gevaar klein" data-actie="verwijder-persoon" data-insc="${i.id}" data-dln="${d.id}">Verwijderen</button></td></tr>`).join('')}
        </table>
        ${wijzTabel(i.wijzigingen)}
      </div>`).join('') || '<p>Geen inschrijvingen gevonden.</p>';

    $('#verw-sectie').classList.toggle('verborgen', !verwijderd.length);
    const groepen = {};
    verwijderd.forEach(w => (groepen[w.referentie] = groepen[w.referentie] || []).push(w));
    $('#verwijderd').innerHTML = Object.values(groepen).map(ws => {
      ws.sort((a, b) => a.aangemaakt_op.localeCompare(b.aangemaakt_op));
      const w = ws[ws.length - 1];
      const open = ws.some(x => x.taak && !x.afgehandeld && !x.vervallen);
      return `
      <div class="inschr ${open ? 'open' : 'betaald'}">
        <div class="inschr-kop"><div>
          <strong>${esc(w.contact_naam)}</strong> · ${esc(w.referentie)}
          <div class="meta">${esc(w.email)}${w.telefoon ? ' · ' + esc(w.telefoon) : ''}</div>
        </div></div>
        ${wijzTabel(ws)}
      </div>`; }).join('');
  }

  function heeftOpen(i) {
    return (!i.betaald && Number(i.inschrijf_bedrag) > 0) ||
      (i.wijzigingen || []).some(w => w.taak && !w.afgehandeld && !w.vervallen);
  }

  function taakCel(w) {
    if (w.vervallen) return '<span class="vervallen">vervallen</span>';
    if (!w.taak) return '<span class="samenvatting">geen actie</span>';
    const label = w.taak === 'betalen' ? 'Betaald' : 'Teruggestort';
    return `<label class="taak ${w.afgehandeld ? '' : 'open-taak'}"><input type="checkbox" data-taak="${w.id}" ${w.afgehandeld ? 'checked' : ''}>
      ${label}</label>${w.afgehandeld_op ? ` <span class="samenvatting">${datum(w.afgehandeld_op)}</span>` : ''}`;
  }

  function wijzTabel(lijst) {
    if (!lijst || !lijst.length) return '';
    const soortTekst = { persoon_toegevoegd: 'Ontvangen', persoon_verwijderd: 'Terugstorten', inschrijving_verwijderd: 'Terugstorten' };
    return `<table class="lijst wijz"><caption>Wijzigingen</caption>
      <tr><th>Datum</th><th>Wijziging</th><th>Bedrag</th><th>Actie</th><th>Mail</th></tr>
      ${lijst.map(w => `<tr>
        <td>${datum(w.aangemaakt_op)}</td>
        <td class="${w.vervallen ? 'vervallen' : ''}">${esc(w.toelichting)}</td>
        <td>${w.taak ? `${soortTekst[w.soort]} ${euro(w.bedrag)}` : (w.nieuw_totaal != null ? `nieuw totaal ${euro(w.nieuw_totaal)}` : '')}</td>
        <td>${taakCel(w)}</td>
        <td>${w.mail_verstuurd_op ? 'verstuurd' : (w.vervallen && w.soort === 'persoon_toegevoegd' ? '–' : 'in wachtrij')}</td>
      </tr>`).join('')}
    </table>`;
  }

  $('#beheer').addEventListener('change', async (e) => {
    const cb = e.target.closest('input[type=checkbox][data-id], input[type=checkbox][data-taak]');
    if (!cb) return;
    cb.disabled = true;
    try {
      const res = cb.dataset.taak
        ? await rpc('beheer_zet_taak', { wachtwoord: ww, wijziging: cb.dataset.taak, is_afgehandeld: cb.checked })
        : await rpc('beheer_zet_betaald', { wachtwoord: ww, inschrijving: cb.dataset.id, is_betaald: cb.checked });
      if (!res.ok) throw new Error(res.fout || 'Opslaan mislukt');
      await laad();
    } catch (err) { alert(err.message); cb.checked = !cb.checked; cb.disabled = false; }
  });

  // ---------- bewerken / verwijderen ----------
  let TEAMS = [];
  rpc('teams').then(t => { if (Array.isArray(t)) TEAMS = t; }).catch(() => {});

  const dlg = $('#dlg');
  let opslaan = null;
  function veld(id, label, waarde, type = 'text', verplicht = true) {
    return `<div class="veld"><label for="${id}">${label}</label>
      <input id="${id}" type="${type}" value="${esc(waarde)}" ${verplicht ? 'required' : ''}></div>`;
  }
  function open(titel, velden, actie) {
    $('#dlg-titel').textContent = titel;
    $('#dlg-velden').innerHTML = velden;
    $('#dlg-melding').innerHTML = '';
    opslaan = actie;
    dlg.showModal();
  }
  $('#dlg-annuleer').addEventListener('click', () => dlg.close());
  $('#dlg-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const leeg = [...$('#dlg-velden').querySelectorAll('[required]')].filter(x => !x.value.trim());
    leeg.forEach(x => x.classList.add('ongeldig'));
    if (leeg.length) return;
    try {
      const res = await opslaan();
      if (!res.ok) throw new Error(res.fout || 'Opslaan mislukt');
      dlg.close();
      await laad();
    } catch (err) { $('#dlg-melding').innerHTML = `<div class="melding fout">${esc(err.message)}</div>`; }
  });
  const v = (id) => $('#' + id).value.trim();

  function persoonVelden(d = {}) {
    return `<div class="rij twee">${veld('p-vn', 'Voornaam', d.voornaam || '')}${veld('p-an', 'Achternaam', d.achternaam || '')}</div>
      <div class="rij twee">${veld('p-gd', 'Geboortedatum', d.geboortedatum || '', 'date')}
      <div class="veld"><label for="p-tm">Team</label><select id="p-tm" required><option value="">Kies een team</option>
        ${TEAMS.map(t => `<option ${t === d.team ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div></div>`;
  }
  const persoonData = () => ({ voornaam: v('p-vn'), achternaam: v('p-an'), geboortedatum: v('p-gd'), team: v('p-tm') });

  function terugstortMelding(i, bedrag) {
    alert(`Er is al betaald. Stort ${euro(bedrag)} handmatig terug en vink daarna "Teruggestort" aan bij de wijziging.\n` +
      `${i.voornaam} krijgt een mail dat het bedrag in overleg wordt teruggestort.\n\n` +
      `Contactpersoon: ${naam(i)}\nE-mail: ${i.email}\nTelefoon: ${i.telefoon}\nReferentie: ${i.referentie}`);
  }

  $('#lijst').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-actie]');
    if (!b) return;
    const i = data.find(x => x.id === b.dataset.insc);
    const d = i && i.deelnemers.find(x => x.id === b.dataset.dln);
    try {
      switch (b.dataset.actie) {
        case 'wijzig-contact':
          open(`Contactpersoon ${i.referentie}`,
            `<div class="rij twee">${veld('c-vn', 'Voornaam', i.voornaam)}${veld('c-tv', 'Tussenvoegsel', i.tussenvoegsel || '', 'text', false)}</div>
             ${veld('c-an', 'Achternaam', i.achternaam)}
             <div class="rij twee">${veld('c-em', 'E-mailadres', i.email, 'email')}${veld('c-tel', 'Telefoon', i.telefoon, 'tel')}</div>`,
            () => rpc('beheer_wijzig_inschrijving', { wachtwoord: ww, inschrijving: i.id,
              contact: { voornaam: v('c-vn'), tussenvoegsel: v('c-tv'), achternaam: v('c-an'), email: v('c-em'), telefoon: v('c-tel') } }));
          break;
        case 'nieuwe-persoon':
          open(`Persoon toevoegen aan ${i.referentie}`,
            persoonVelden() + `<p class="samenvatting">Na opslaan krijgt ${esc(naam(i))} automatisch een betaalverzoek per mail voor het bedrag van deze persoon.</p>`,
            async () => {
              const res = await rpc('beheer_voeg_deelnemer_toe', { wachtwoord: ww, inschrijving: i.id, gegevens: persoonData() });
              if (res.ok) setTimeout(() => alert(`Persoon toegevoegd. Er gaat een betaalverzoek van ${euro(res.bedrag)} naar ${i.email}.`), 50);
              return res;
            });
          break;
        case 'verwijder-persoon': {
          const laatste = i.deelnemers.length === 1;
          if (!confirm(`${d.voornaam} ${d.achternaam} verwijderen?` +
            (laatste ? '\n\nDit is de laatste persoon: de hele inschrijving wordt verwijderd.' : '') +
            '\n\nDe contactpersoon krijgt hierover een mail.')) return;
          const res = await rpc('beheer_verwijder_deelnemer', { wachtwoord: ww, deelnemer: d.id });
          if (!res.ok) throw new Error(res.fout);
          await laad();
          if (Number(res.terug) > 0) terugstortMelding(i, res.terug);
          break;
        }
        case 'verwijder-insc': {
          if (!confirm(`Inschrijving ${i.referentie} van ${naam(i)} (${i.deelnemers.length} personen) verwijderen?` +
            '\n\nDe contactpersoon krijgt hierover een mail.' +
            '\n\nDit kan niet ongedaan worden gemaakt.')) return;
          const res = await rpc('beheer_verwijder_inschrijving', { wachtwoord: ww, inschrijving: i.id });
          if (!res.ok) throw new Error(res.fout);
          await laad();
          if (Number(res.terug) > 0) terugstortMelding(i, res.terug);
          break;
        }
      }
    } catch (err) { alert(err.message); }
  });

  ['input', 'change'].forEach(ev => {
    $('#zoek').addEventListener(ev, teken);
    $('#filter-betaald').addEventListener(ev, teken);
    $('#filter-team').addEventListener(ev, teken);
  });
  $('#ververs').addEventListener('click', () => laad().catch(err => alert(err.message)));

  $('#export').addEventListener('click', () => {
    const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rijen = [['Referentie', 'Contactpersoon', 'E-mail', 'Telefoon', 'Betaald', 'Totaal', 'Voornaam', 'Achternaam', 'Geboortedatum', 'Team', 'Tarief', 'Prijs']];
    data.forEach(i => i.deelnemers.forEach(d => rijen.push([i.referentie, naam(i), i.email, i.telefoon, i.betaald ? 'ja' : 'nee',
      String(i.totaal_bedrag).replace('.', ','), d.voornaam, d.achternaam, gebdatum(d.geboortedatum), d.team, d.categorie, String(d.prijs).replace('.', ',')])));
    const csv = '﻿' + rijen.map(r => r.map(q).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'inschrijvingen-fc-utrecht.csv';
    a.click();
  });

  if (ww) laad().catch(() => {});
})();
</script>
</body>
</html>
