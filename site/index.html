<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inschrijven FC Utrecht - Fortuna Sittard | VVZ'49</title>
  <link rel="icon" href="https://thewally.github.io/vvz-toolbox/logo-vvz.png">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
</head>
<body>
<div class="wrap">
  <header class="kop">
    <img src="https://thewally.github.io/vvz-toolbox/logo-vvz.png" alt="VVZ'49">
    <div class="wedstrijd">
      <img src="img/fc-utrecht.png" alt="FC Utrecht">
      <h1 id="titel">FC Utrecht - Fortuna Sittard</h1>
      <img src="img/fortuna-sittard.png" alt="Fortuna Sittard">
    </div>
    <p id="datum"></p>
  </header>

  <ol class="stappen" id="stappen">
    <li data-stap="1">1. Contactpersoon</li>
    <li data-stap="2">2. Deelnemers</li>
    <li data-stap="3">3. Overzicht &amp; betalen</li>
  </ol>

  <div id="gesloten" class="melding fout verborgen"></div>

  <form id="formulier" novalidate>
    <!-- Stap 1 -->
    <section data-stap="1">
      <div class="intro" id="intro"></div>
      <h2>Contactpersoon</h2>
      <div class="rij drie">
        <div class="veld"><label for="c-voornaam">Voornaam</label><input id="c-voornaam" autocomplete="given-name" required></div>
        <div class="veld"><label for="c-tussenvoegsel">Tussenvoegsel</label><input id="c-tussenvoegsel" placeholder="optioneel"></div>
        <div class="veld"><label for="c-achternaam">Achternaam</label><input id="c-achternaam" autocomplete="family-name" required></div>
      </div>
      <div class="rij twee">
        <div class="veld"><label for="c-email">E-mailadres</label><input id="c-email" type="email" autocomplete="email" required></div>
        <div class="veld"><label for="c-telefoon">Telefoonnummer</label><input id="c-telefoon" type="tel" autocomplete="tel" required></div>
      </div>
      <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="acties"><button type="button" class="knop-primair rechts" data-naar="2">Volgende</button></div>
    </section>

    <!-- Stap 2 -->
    <section data-stap="2" class="verborgen">
      <h2>Wie schrijf je in?</h2>
      <div id="personen"></div>
      <button type="button" class="knop-secundair" id="persoon-toevoegen">+ Deelnemer toevoegen</button>
      <div class="acties">
        <button type="button" class="knop-secundair" data-naar="1">Vorige</button>
        <button type="button" class="knop-primair" data-naar="3">Volgende</button>
      </div>
    </section>

    <!-- Stap 3 -->
    <section data-stap="3" class="verborgen">
      <h2>Overzicht</h2>
      <p class="samenvatting" id="samenvatting"></p>
      <table class="spec" id="spec"></table>
      <div id="melding"></div>
      <div class="acties">
        <button type="button" class="knop-secundair" data-naar="2">Vorige</button>
        <button type="submit" class="knop-primair" id="betaal-knop">Inschrijven en betalen</button>
      </div>
    </section>
  </form>
</div>

<template id="persoon-template">
  <div class="persoon">
    <div class="persoon-kop">
      <strong class="persoon-nr"></strong>
      <button type="button" class="knop-link verwijder">Verwijderen</button>
    </div>
    <div class="rij twee">
      <div class="veld"><label>Voornaam</label><input class="p-voornaam" required></div>
      <div class="veld"><label>Achternaam</label><input class="p-achternaam" required></div>
    </div>
    <div class="rij twee">
      <div class="veld"><label>Geboortedatum</label><input class="p-geboortedatum" type="date" required><div class="categorie"></div></div>
      <div class="veld"><label>Bij wie wil je zitten?</label><select class="p-team" required><option value="">Kies een team</option></select></div>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
