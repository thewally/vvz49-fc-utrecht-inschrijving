name: Deploy naar GitHub Pages
# Publiceert site/ naar GitHub Pages (Data API URL komt uit de secret NEON_DATA_API_URL)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-pages.yml']
  workflow_run:
    workflows: ['Database migreren']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Data API URL invullen vanuit secret
        env:
          NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
        run: |
          if [ -z "$NEON_DATA_API_URL" ]; then echo "::error::Secret NEON_DATA_API_URL ontbreekt"; exit 1; fi
          sed -i "s|__NEON_DATA_API_URL__|${NEON_DATA_API_URL%/}|" site/config.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JWKS en anoniem token maken
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
        run: |
          node scripts/make-token.mjs
          grep -q "__" site/config.js && { echo "::error::config.js niet volledig ingevuld"; exit 1; } || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
