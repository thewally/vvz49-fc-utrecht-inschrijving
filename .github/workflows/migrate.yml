name: Database migreren
# Voert db/*.sql uit, zet het beheerwachtwoord en ververst de Data API schema-cache

on:
  push:
    branches: [main]
    paths: ['db/**', '.github/workflows/migrate.yml']
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BEHEER_WACHTWOORD: ${{ secrets.BEHEER_WACHTWOORD }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Postgres-client installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Migraties uitvoeren
        run: |
          for f in db/*.sql; do
            echo "==> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Beheerwachtwoord instellen
        if: env.BEHEER_WACHTWOORD != ''
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -v ww="$BEHEER_WACHTWOORD" <<'SQL'
          insert into beheer_instellingen (sleutel, waarde)
          values ('wachtwoord_hash', crypt(:'ww', gen_salt('bf', 10)))
          on conflict (sleutel) do update set waarde = excluded.waarde;
          SQL

      - name: Data API schema-cache verversen
        if: env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != ''
        continue-on-error: true
        run: |
          npx -y neonctl@latest data-api refresh-schema \
            --project-id "$NEON_PROJECT_ID" --branch production --database neondb --api-key "$NEON_API_KEY"

      - name: Herinnering schema-cache
        if: env.NEON_API_KEY == '' || env.NEON_PROJECT_ID == ''
        run: echo "::warning::Klik in Neon op 'Refresh schema cache' (of zet de secrets NEON_API_KEY en NEON_PROJECT_ID)."
